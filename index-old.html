<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgenticVoyage</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a2b;
        --text: #e6edf7;
        --muted: #a0aec0;
        --accent: #7c9cff;
        --accent-2: #64d6c8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #111827);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .container {
        width: min(90vw, 760px);
        background: rgba(18, 26, 43, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 48px 32px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        color: var(--accent-2);
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: 0.2s ease;
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #08111f;
      }

      .button.secondary {
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: var(--text);
      }

      .button:hover {
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="eyebrow">Explore the future</div>
      <h1>AgenticVoyage</h1>
      <p>
        A minimal landing page for a bold, intelligent, and forward-looking digital experience.
        Built to spark curiosity and invite discovery.
      </p>
      <div class="actions">
        <a class="button primary" href="#">Learn more</a>
        <a class="button secondary" href="#">Get started</a>
      </div>
    </main>
  </body>
</html>
